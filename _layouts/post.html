---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>

  <div class="date">
    {{ page.date | date: "%Y年%-m月%-d日" }}
  </div>
  {% if page.tags.size > 0 %}
  <div class="post-tags">
    {% for tag in page.tags %}
    <a class="post-tag" href="{{ site.baseurl }}/tags/#{{ tag | slugify }}">#{{ tag }}</a>
    {% endfor %}
  </div>
  {% endif %}

  <div class="entry">
    {{ content }}
  </div>

  {% include disqus.html %}
</article>

#
# This file contains configuration flags to customize your site
#

# Name of your site (displayed in the header)
name: fztym

# Short bio or description (displayed in the header)
description: La couleur est ma joie et mon tourment

# URL of your avatar or profile pic (you could use your GitHub profile pic)
avatar: https://avatars.githubusercontent.com/u/63768343?s=96&v=4

# CV. The copy under assets/pdf/ is what visitors open: GitHub serves release
# assets with `Content-Disposition: attachment`, which forces a download instead
# of showing the PDF, while GitHub Pages serves it inline.
# Refresh the local copy with scripts/sync_cv.sh after the CV repo rebuilds.
cv_url: /assets/pdf/cv-a.pdf
cv_source: https://github.com/zty2004/CV/releases/download/latest/cv-a.pdf

#
# Flags below are optional
#

# Includes an icon in the footer for each username you enter
footer-links:
  dribbble:
  email: zty13162909941@126.com
  facebook:
  flickr:
  github: zty2004
  instagram:
  linkedin:
  pinterest:
  rss: # just type anything here for a working RSS icon
  twitter: 
  stackoverflow: # your stackoverflow profile, e.g. "users/50476/bart-kiers"
  youtube: # channel/<your_long_string> or user/<user-name>
  googleplus: # anything in your profile username that comes after plus.google.com/


# Enter your Disqus shortname (not your username) to enable commenting on posts
# You can find your shortname on the Settings page of your Disqus account
disqus:

# giscus comments (https://giscus.app) — powered by GitHub Discussions.
# Setup: 1) enable Discussions in repo Settings; 2) install the giscus App
# (https://github.com/apps/giscus); 3) generate the IDs on giscus.app and fill in below.
giscus:
  repo: zty2004/zty2004.github.io
  repo_id: R_kgDOK_q2Hg
  category: Announcements
  category_id: DIC_kwDOK_q2Hs4DCXcx

# busuanzi visitor statistics (https://busuanzi.ibruce.info) — set true to enable
busuanzi: true

# Enter your Google Analytics web tracking code (e.g. UA-2110908-2) to activate tracking
google_analytics:

# Your website URL (e.g. http://barryclark.github.io or http://www.barryclark.co)
# Used for Sitemap.xml and your RSS feed
url: https://zty2004.github.io

# If you're hosting your site at a Project repository on GitHub pages
# (http://yourusername.github.io/repository-name)
# and NOT your User repository (http://yourusername.github.io)
# then add in the baseurl here, like this: "/repository-name"
baseurl: ""

#
# !! You don't need to change any of the configuration flags below !!
#

permalink: /:title/

# Pages live in _pages/ (underscore dirs are excluded by default)
include:
  - _pages

# The release of Jekyll Now that you're using
version: v1.2.0

# Jekyll 3 now only supports Kramdown for Markdown
kramdown:
  # Use GitHub flavored markdown, including triple backtick fenced code blocks
  input: GFM
  # Jekyll 3 and GitHub Pages now only support rouge for syntax highlighting
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    # Use existing pygments syntax highlighting css
    css_class: 'highlight'

# Set the Sass partials directory, as we're using @imports
sass:
  style: :compressed # minified CSS output

# Use the following plug-ins ('plugins' is the current key; 'gems' is legacy)
plugins:
  - jekyll-sitemap # Create a sitemap using the official Jekyll sitemap gem
  - jekyll-feed # Create an Atom feed using the official Jekyll feed gem
  - jekyll-seo-tag # <meta> tags, Open Graph and Twitter cards

# Used by jekyll-seo-tag
author:
  name: Tianyou Zuo
twitter:
  card: summary_large_image
# og:image is emitted by _includes/meta.html (post thumb, else the avatar),
# so no site-level `logo` here — that would duplicate the tag.

# Feed generated by our own feed.xml (absolute image URLs), so silence the plugin's
feed:
  path: feed-atom.xml

# Exclude these files from your production _site
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
  - src
  - scripts

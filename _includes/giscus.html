{% if site.giscus.repo %}
<div class="comments">
  <div class="giscus"></div>
  <script>
    (function () {
      // giscus theme follows the site's light/dark switch
      function giscusTheme() {
        return document.documentElement.getAttribute('data-theme') === 'dark'
          ? 'noborder_dark' : 'light';
      }

      var mount = document.querySelector('.giscus');

      // The script is built at injection time (not upfront) so it always picks
      // up the CURRENT theme — the reader may flip the switch long before
      // scrolling down here.
      function inject() {
        if (mount.dataset.loaded) return;
        mount.dataset.loaded = '1';

        var s = document.createElement('script');
        s.src = 'https://giscus.app/client.js';
        s.async = true;
        s.crossOrigin = 'anonymous';
        s.setAttribute('data-repo', '{{ site.giscus.repo }}');
        s.setAttribute('data-repo-id', '{{ site.giscus.repo_id }}');
        s.setAttribute('data-category', '{{ site.giscus.category }}');
        s.setAttribute('data-category-id', '{{ site.giscus.category_id }}');
        s.setAttribute('data-mapping', 'pathname');
        s.setAttribute('data-strict', '0');
        s.setAttribute('data-reactions-enabled', '1');
        s.setAttribute('data-emit-metadata', '0');
        s.setAttribute('data-input-position', 'top');
        s.setAttribute('data-theme', giscusTheme());
        s.setAttribute('data-lang', 'zh-CN');
        s.setAttribute('data-loading', 'lazy');
        mount.appendChild(s);
      }

      // only fetch giscus once the reader approaches the comment section
      if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (entries) {
          if (entries.some(function (e) { return e.isIntersecting; })) {
            io.disconnect();
            inject();
          }
        }, { rootMargin: '200px' });
        io.observe(mount);
      } else {
        inject();
      }

      // Re-theme the iframe when the switch is flipped. If giscus has not
      // loaded yet there is nothing to message — inject() will read the fresh
      // theme itself — and if the iframe is still booting, retry briefly.
      function applyTheme(attempt) {
        var iframe = document.querySelector('iframe.giscus-frame');
        if (!iframe || !iframe.contentWindow) {
          if (mount.dataset.loaded && (attempt || 0) < 20) {
            setTimeout(function () { applyTheme((attempt || 0) + 1); }, 300);
          }
          return;
        }
        iframe.contentWindow.postMessage(
          { giscus: { setConfig: { theme: giscusTheme() } } },
          'https://giscus.app'
        );
      }

      new MutationObserver(function () {
        applyTheme(0);
      }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    })();
  </script>
</div>
{% endif %}
